<!DOCTYPE html>
<html>
<head>
	<title>Strava-Plus challenges</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }
        h1 {
            margin-top: 60px;
            margin-left: 10px;
        }

        h2, p {
            margin: 10px;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f7fa;
            top: 0;
            width: 100%;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(0, 0, 0);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover:not(.active) {
            background-color: #004aad;
        }

        ul li a.active {
            background-color: #f7f7fa;
        }

        .challenges-container {
        display: grid;
        /* auto-fill verhindert, dass 1 einzelne Karte die ganze Zeile ausfüllt */
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
        
        /* Optional: Zentriert das Grid auf großen Bildschirmen */
        max-width: 1200px;
        margin: 0 auto;
    }
    .reward-card img {
    width: 300px;         /* Feste Breite */
    height: 300px;        /* Feste Höhe */
    object-fit: contain;  /* Bild wird passend skaliert, ohne zu verzerren */
    display: block;
    margin: 10px auto;    /* Zentriert das Bild in der Karte */
}

    .challenge-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;
    }
    /* Container: Raster mit 4 gleich breiten Spalten */
    .rewards-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* Genau 4 Spalten */
        gap: 20px;                             /* Abstand zwischen den Karten */
        padding: 20px;
    }

    /* Einzelne Medaillen-Karte */
    .reward-card {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* Feste Bildgröße & saubere Skalierung */
    .reward-card img {
        width: 300px;
        height: 300px;
        object-fit: contain; /* Verhindert Verzerrung */
        margin-bottom: 10px;
    }

    /* Optional: Mobilfreundlich (auf kleinen Bildschirmen responsive machen) */
    @media (max-width: 900px) {
        .rewards-grid {
            grid-template-columns: repeat(2, 1fr); /* 2 Spalten auf Tablets */
        }
    }
    @media (max-width: 500px) {
        .rewards-grid {
            grid-template-columns: 1fr;            /* 1 Spalte auf Handys */
        }
    }

    .challenge-image {
        width: 100%;
        height: 140px;
        object-fit: cover;
    }

    .challenge-content {
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .challenge-content h2 {
        font-size: 21px;
        margin: 0 0 15px 0;
    }

    .description {
        font-size: 16px;
        line-height: 1.4;
    }

    .challenge-info {
        font-size: 16px;
        margin-bottom: 5px;
    }

    .challenge-date {
        font-size: 16px;
        margin-top: 0;
    }

    .participants {
        font-size: 16px;
        margin-top: 5px;
    }

    .challenge-card button {
        margin-top: auto;

        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #ff5500;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .challenge-card button:hover {
        background: #e64d00;
    }
    </style>
</head>
<body>
    <ul class="nav-list">
            <li><a href="http://localhost:8000/upload-html">Training hochladen</a></li>
            <li><a href="http://localhost:8000/challenges">Herausforderungen</a></li>
            <li><a href="http://localhost:8000/rewards">Abzeichnungen</a></li>
            <li><a href="http://localhost:8000/about">Über Strava-Plus</a></li>
            <li><a href="http://localhost:8000/profile">Profile</a></li>
            <li><a href="http://localhost:8000/register">Register</a></li>
        </ul>
	
    <div id="rewards-container" class="rewards-grid">
        <p>Lade Abzeichnungen</p>
    </div>    

    <script>
    function uploadRewards() {
        fetch('http://localhost:8000/api/rewards') // schickt anfrage an den server auf route api/challenges
        .then(response => {                           // sobald der server antwortete, mach folgendes
            if (!response.ok) {                       // prüft, ob alles ok ist
                throw new Error("Server-Fehler: " + response.status); // fehler, wenn es schief geht
            } 
            return response.json();                   //nimmt string text vom server und wandelt ihn in javaskript-array
        })
        .then(data => {
            const container = document.getElementById('rewards-container'); //greift sich das div-element aus html-code
            container.innerHTML = ''; //platzhalter "lade..." entfernen

            //wenn vom server ein array mit viele challenges kommt, dann in array packen
            const completed = data.filter(item => item.status === 2);

            if (completed.length === 0) {
                container.innerHTML = '<p>keine herausforderungen vorhanden</p>'
                return;
            }

            //const imgPath = completed.imagePathReward;
            //console.log(imgPath);

            completed.forEach(challenge => {//baut dynamische challenge karte für webseite
                let imgPath = (challenge.imagePathReward || challenge.picture_reward || '');

                const card = document.createElement('div');
                card.className = 'reward-card';
                card.innerHTML = `
                    <img src="${imgPath}" alt="${challenge.challengeName}">  
                    <p class="description">${challenge.challengeName}</p>
                `;
                container.appendChild(card);
            });
            })
        .catch(err => {//fehlermeldung, falls etwas schief geht
            console.error("fehler: ", err);
            document.getElementById('rewards-container').innerHTML = '<p>Fehler beim Laden der Herausforderungen.</p>';
        });
    }

    window.addEventListener('DOMContentLoaded', uploadRewards); //wartet bis die grundstruktur der html-seite geladen ist und dann ruft funktion auf

</script>
</body>
</html>
