<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<title>Dein Profile</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        :root {
            --primary-color: #004aad; 
            --bg-color: #f4f5f7;
            --text-main: #333333;
            --text-light: #555555;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0px; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }
        /* Typography */
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            /*margin-left: -35px;*/
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            color: #222;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        p {
            color: var(--text-light);
            margin-bottom: 15px;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f7fa;
            top: 0;
            width: 100%;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(0, 0, 0);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover:not(.active) {
            background-color: #004aad;
        }

        ul li a.active {
            background-color: #f7f7fa;
        }   
        /* Daten-Begriffe am Ende */
        .data-dictionary {
            list-style-type: none;
            padding: 0;
        }

        .data-dictionary li {
            background-color: #f9f9f9;
            margin-bottom: 10px;
            padding: 15px 20px;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }

        .data-dictionary p {
            margin: 0;
        }

        dfn {
            font-weight: 700;
            font-style: normal;
            color: #111;
            font-size: 1.1rem;
        }
        
        .profile-container{
            margin-left: 35px;
        }
        .flex { 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .profile-image {
            border-radius: 20px;
        }

        .avatar-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Macht das Element kreisrund */
            background-color: #e4e6eb;
            border: 3px solid #004aad;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden; /* Schneidet das Foto außerhalb des Kreises ab */
            position: relative;
            font-family: sans-serif;
            color: #555;
            font-weight: bold;
        }

        /* Sorgt dafür, dass das Foto den Kreis perfekt ausfüllt ohne zu verzerren */
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .avatar-circle:hover {
            opacity: 0.9;
        }
    
        .profil-information-table {
            width: 15%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .profil-information-table tr {
            border-bottom: 1px solid #eee;
        }

        .profil-information-table tr:last-child {
            border-bottom: none;
        }

        .profil-information-table td {
            padding: 12px 15px;
            font-size: 0.95rem;
        }

        /* Левая ячейка (название метрики) */
        .profil-information-table td.label {
            color: #666;
            font-weight: 500;
        }

        /* Правая ячейка (значение метрики) */
        .profil-information-table td.value {
            min-width: 120px;
            font-weight: bold;
            color: #111;
            font-variant-numeric: tabular-nums; /* Чтобы цифры не прыгали */
        }

        .dashboard-wrapper {
            display: flex;
            justify-content: space-between; /* Verteilt Elemente über die gesamte Breite */
            padding-left: 35px;             /* Abstand von der linken Kante */
            padding-right: 35px;            /* Abstand von der rechten Kante */
            align-items: flex-start;        /* Oben bündig ausrichten */
        }

        .profil-dashboard-container {
            width: 800px;                   /* Feste/Begrenzte Breite für sauberes Layout */
        }

        /* Drückt das rechte Element ganz an die rechte Kante */
        .profil-dashboard-container.rechts {
            margin-left: auto;
        }        
        .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .edit-btn:hover {
            opacity: 1.0;
        }

        /* Styling für das Eingabefeld beim Bearbeiten */
        .edit-input {
            width: 80px;
            padding: 2px 4px;
            font-size: 0.9rem;
            border: 1px solid #004aad;
            border-radius: 3px;
        }
    </style>

</head>
<body>
    <nav>
        <ul class="nav-list">
            <li><a href="http://localhost:8000/upload-html">Training hochladen</a></li>
            <li><a href="http://localhost:8000/challenges">Herausforderungen</a></li>
            <li><a href="http://localhost:8000/rewards">Abzeichnungen</a></li>
            <li><a href="http://localhost:8000/about">Über Strava-Plus</a></li>
            <li><a href="http://localhost:8000/profile">Profile</a></li>
            <li><a href="http://localhost:8000/register">Register</a></li>
            <li><a href="http://localhost:8000/login">Login</a></li>
        </ul>
    </nav>

    <div class="profile-container" id="profile-container"></div>

    <!-- persönliche daten tabelle -->
    <div class="dashboard-wrapper">
        <div class="profil-dashboard-container left">
            <h3>Login</h3>

            <table class="login-table">
                <tr>
                    <td class="label">Benutzername</td>
                    <td><input type="text" id="username" name="username" placeholder="Geben Sie Ihren Benutzernamen ein" required></td>
                </tr>
                <tr>
                    <td class="label">Passwort</td>
                    <td><input type="password" id="password" name="password" placeholder="Geben Sie Ihr Passwort ein" required></td>
                </tr>
                
                <tr>
                    <td><input type="button" value="Absenden" onclick="submitLogin()"></td>
                </tr>
            </table>            
        </div>                     
    </div>


    <script>
        async function submitLogin() {
            if (!validateForm()) {
                return;
            }

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            sendData(username, password);            
        }

        function sendData(username, password) {
            const userData = {
                username: username,
                password: password
            };

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            })
            .then(response => {
                if (response.ok) {
                    alert("Login erfolgreich");
                } else {
                    alert("Fehler beim Login auf dem Server");
                }
            })
            .catch(err => {
                console.error("Netzwerkfehler: " + err);
            });
        }

        function checkUserInput(elementID, userInput) { //checkt leere eingabe ohne db aufruf
            if (elementID === "username") {
                console.log("username check leer");
                if (userInput.trim() === "") {
                    console.log(userInput.trim() === "");
                    alert("Username darf nicht leer sein");
                    return false;
                } 
            }

            if (elementID === "password") {
                if (userInput.trim() === "") {
                    alert("Passwort darf nicht leer sein");
                    return false;
                } else if (!checkUserPassword(userInput)) { //wenn falsch -> return false
                    return false;
                }
            }
            return true;
        }

        function checkUserPassword(password) {
            const hatZahl = /\d/.test(password); // hat eine Zahl 
            const hatBigLetter = /[A-Z]/.test(password); //hat einen großbuchstaben
            const hatSmallLetter = /[a-z]/.test(password); // hat einen kleinbuchstaben
            const hatSpecialCharacter = /[^a-zA-Z0-9]/.test(password); // hat ein sonderzeichen

            if (password.length < 12) {
                alert("Passwort muss länger 12 Zeichen sein");
                return false;
            } else if (!hatZahl) {
                alert("Passwort muss mindestens eine Zahl haben");
                return false;
            } else if (!hatBigLetter) {
                alert("Passwort muss mindestens einen Großbuchstabe haben");
                return false;
            }else if (!hatSmallLetter) {
                alert("Passwort muss mindestens einen Kleinbuchstabe haben");
                return false;
            }else if (!hatSpecialCharacter) {
                alert("Passwort muss mindestens ein sonderzeichen haben");
                return false;
            }

            return true;
        }

        function validateForm() {  //prüft ob alle eingaben gültig sind
            const fields = [
                "username", "password"
            ];

            for (const fieldID of fields) {
                const element = document.getElementById(fieldID);
                if (!element || !checkUserInput(fieldID, element.value)) {
                    return false; //stop bei erster ungültigen angabe
                }
            }
            return true;
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) {
                submitBtn.addEventListener("click", submitLogin
                )
            }
        })

    </script>
</body>
</html>
