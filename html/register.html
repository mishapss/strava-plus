<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<title>Dein Profile</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        :root {
            --primary-color: #004aad; 
            --bg-color: #f4f5f7;
            --text-main: #333333;
            --text-light: #555555;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0px; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }
        /* Typography */
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            /*margin-left: -35px;*/
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            color: #222;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        p {
            color: var(--text-light);
            margin-bottom: 15px;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f7fa;
            top: 0;
            width: 100%;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(0, 0, 0);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover:not(.active) {
            background-color: #004aad;
        }

        ul li a.active {
            background-color: #f7f7fa;
        }   
        /* Daten-Begriffe am Ende */
        .data-dictionary {
            list-style-type: none;
            padding: 0;
        }

        .data-dictionary li {
            background-color: #f9f9f9;
            margin-bottom: 10px;
            padding: 15px 20px;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }

        .data-dictionary p {
            margin: 0;
        }

        dfn {
            font-weight: 700;
            font-style: normal;
            color: #111;
            font-size: 1.1rem;
        }
        
        .profile-container{
            margin-left: 35px;
        }
        .flex { 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .profile-image {
            border-radius: 20px;
        }

        .avatar-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Macht das Element kreisrund */
            background-color: #e4e6eb;
            border: 3px solid #004aad;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden; /* Schneidet das Foto außerhalb des Kreises ab */
            position: relative;
            font-family: sans-serif;
            color: #555;
            font-weight: bold;
        }

        /* Sorgt dafür, dass das Foto den Kreis perfekt ausfüllt ohne zu verzerren */
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .avatar-circle:hover {
            opacity: 0.9;
        }
    
        .profil-information-table {
            width: 15%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .profil-information-table tr {
            border-bottom: 1px solid #eee;
        }

        .profil-information-table tr:last-child {
            border-bottom: none;
        }

        .profil-information-table td {
            padding: 12px 15px;
            font-size: 0.95rem;
        }

        /* Левая ячейка (название метрики) */
        .profil-information-table td.label {
            color: #666;
            font-weight: 500;
        }

        /* Правая ячейка (значение метрики) */
        .profil-information-table td.value {
            min-width: 120px;
            font-weight: bold;
            color: #111;
            font-variant-numeric: tabular-nums; /* Чтобы цифры не прыгали */
        }

        .dashboard-wrapper {
            display: flex;
            justify-content: space-between; /* Verteilt Elemente über die gesamte Breite */
            padding-left: 35px;             /* Abstand von der linken Kante */
            padding-right: 35px;            /* Abstand von der rechten Kante */
            align-items: flex-start;        /* Oben bündig ausrichten */
        }

        .profil-dashboard-container {
            width: 350px;                   /* Feste/Begrenzte Breite für sauberes Layout */
        }

        /* Drückt das rechte Element ganz an die rechte Kante */
        .profil-dashboard-container.rechts {
            margin-left: auto;
        }        
        .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .edit-btn:hover {
            opacity: 1.0;
        }

        /* Styling für das Eingabefeld beim Bearbeiten */
        .edit-input {
            width: 80px;
            padding: 2px 4px;
            font-size: 0.9rem;
            border: 1px solid #004aad;
            border-radius: 3px;
        }
    </style>

</head>
<body>
    <nav>
        <ul class="nav-list">
            <li><a href="http://localhost:8000/upload-html">Training hochladen</a></li>
            <li><a href="http://localhost:8000/challenges">Herausforderungen</a></li>
            <li><a href="http://localhost:8000/rewards">Abzeichnungen</a></li>
            <li><a href="http://localhost:8000/about">Über Strava-Plus</a></li>
            <li><a href="http://localhost:8000/profile">Profile</a></li>
            <li><a href="http://localhost:8000/register">Register</a></li>
            <li></li>
        </ul>
    </nav>

    <div class="profile-container" id="profile-container"></div>

    <!-- persönliche daten tabelle -->
    <div class="dashboard-wrapper">
        <div class="profil-dashboard-container left">
            <h3>Persönliche Information</h3>

            <table class="profil-information-register-table">
                <tr>
                    <td class="label">Vorname</td>
                    <td><input type="text" id="firstName" name="firstName" placeholder="Geben Sie Ihren Vornamen ein" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">Nachname</td>
                    <td><input type="text" id="secondName" name="secondName" placeholder="Geben Sie Ihren Nachnamen ein" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">Alter</td>
                    <td><input type="number" id="age" name="age" placeholder="Wie alt sind Sie?" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">Geschlecht</td>
                    <td><input type="text" id="sex" name="sex" placeholder="Weblich/männlich/divers" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">Gewicht</td>
                    <td><input type="number" id="weight" name="weight" placeholder="Gewicht (kg)" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">Größe</td>
                    <td><input type="number" id="height" name="height" placeholder="Größe (cm)" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">max. HR</td>
                    <td><input type="number" id="maxHR" name="maxHR" placeholder="Maximale Herzfrequenz" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
                <tr>
                    <td class="label">ruhe HR</td>
                    <td><input type="number" id="restingHR" name="restingHR" placeholder="Ruhe Herzfrequenz" required></td>
                    <td><input type="submit" value="Absenden"></td>
                </tr>
            </table>            
        </div>                     
    </div>


    <script>
        function getUserInput(elementID, fieldName) {
            const inputElement = document.getElementById(elementID);
            const userInput = inputElement.value; //bekommt wert von der user eingabe aus input feld 

            checkUserInput(elementID, userInput);
        }

        function checkUserInput(elementID, userInput) {
            if ((elementID === "age") && (userInput <= 7 || userInput > 122)) { //prüft welcher element die eingabe ist
                alert("Alter muss im Bereich 7-122 sein"); //prüft ob die alter eingabe gültig ist
                return false;
            }

            if (elementID === "firstName" || elementID === "secondName") {
                const containsNumber = /\d/.test(userInput); //prüft, ob die eingabe ziffern enthält

                if (containsNumber) {
                    alert("Der Vor- Nachname darf keine Ziffern enthalten");
                    return false;
                }                
            }

            if (elementID === "sex") {
                const validGenders = ["männlich", "weiblich", "divers"];
                if (!validGenders.includes(input.toLowerCase())) {
                    alert("Das Geschlecht muss 'männlich', 'weiblich' oder 'divers' sein.");
                    return false;
                }
            }
            const numericFields = ["age", "weight", "height", "maxHR", "minHR"];
            if (numericFields.includes(elementID)) { //wenn einer der obengennante felder eingegeben wurde, dann...
                const num = Number(input); //wandelt string in zahl um
                if (input === "" || isNaN(num)) { //wenn keine zahl ist
                    alert("Bitte gib einen gültigen Zahlenwert ein.");
                    return false;
                }

                if (elementID === "age" && (num < 7 || num > 122)) {
                    alert("Alter muss im Bereich 7 - 122 Jahre sein.");
                    return false;
                }

                if ((elementID === "weight") && (num < 5 || num > 150)) {
                    alert("Das Gewicht muss im Bereich 5 - 150kg sein");
                    return false;                
                } 

                if ((elementID === "height") && (num < 60 || num > 250)) {
                    alert("Die Größe muss im Bereich 60 - 250 cm sein");
                    return false;
                }

                if ((elementID === "maxHR") && (num < 150 || num > 210)) {
                    alert("Max HR muss im Bereich 150 - 210 sein");
                    return false;
                }

                if ((elementID === "minHR") && (num < 26 || num > 90)) {
                    alert("Min HR muss im Bereich 26 - 90 sein");
                    return false;
                }  
        }

        function saveField(elementID, fieldName) {
            //schritt 1
            const inputElement = document.getElementById("input-" + elementID); //holt den element mit bestmmten ID
            const newValue = inputElement.value; //liest neuen wert aus

            if (!checkNewValue(newValue, elementID)) {//gültigkeitsprüfunf fürs feld
                alert("Ungültige Angabe!");
                return;
            }

            //schritt 2
            const tabelleCell = document.getElementById(elementID);
            tabelleCell.innerText = newValue + getUnit(elementID); //ersetzt innere html inhalt der zelle durch reinen text 

            //schritt 3
            const payload = {
                field: fieldName,
                value: newValue
            };

            //schritt 4
            fetch('/api/update-profile', { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'}, //setzen headers auf 'Content-Type': 'application/json'
                body: JSON.stringify(payload) //wandelt den objekt in json um
            })
            //schritt 5
            .then(response => {
                if (response.ok) {
                    console.log("erfolgreich gespeichert");
                }
            })
            .catch(err => console.error("Fehler beim Speichern:", err))
        }

        function checkNewValue(newValue, elementID) { //prüft ob der wert für das feld gültig
            if (elementID === "stat-age" || elementID === "stat-weight" || elementID === "stat-height" || elementID === "stat-max-hr"
                || elementID === "stat-resting-hr") {
               
               if (isNaN(newValue) || newValue.trim() === "" || Number(newValue) <= 0) {
                console.log("Die Eingabe muss eine Zahl sein und sie muss größer 0 sein!");
                return false;
               }
            }

            if (elementID === "stat-sex") {
                if (!(newValue === "männlich" || newValue === "weiblich" || newValue === "divers")) {
                    console.log("Der Geschlecht muss 'männlich' oder 'weiblich' oder 'divers' sein");
                    return false;
                }
            }
            return true;
        }

        function getUnit(elementID) { //fügt die einheiten nach der änderung der daten zu
            if (elementID === "stat-age" || elementID === "stat-sex") {
                return "";
            } else if (elementID === "stat-weight") {
                return " kg";
            } else if (elementID === "stat-height") {
                return " cm";
            } else if (elementID === "stat-max-hr" || elementID === "stat-resting-hr") {
                return " bpm";
            }

            return "";
        }

        function loadTrainingChart() {
            fetch('http://localhost:8000/api/training-history')
            .then(response => response.json()) //server-antwort in json umwandeln
            .then(data => {

                //diagramm für alle monate
                const allMonthsDates = data.allTime.map(e => e.date);
                const allMonthsDistances = data.allTime.map(e => Number(e.distance.toFixed(1)));

                const ctxAllMonths = document.getElementById('allMonthsChart').getContext('2d');

                new Chart(ctxAllMonths, {
                    type: 'bar', //art von diagramm
                    data: {     //daten, dei angezeigt werden müssen
                        labels: allMonthsDates, //x-achse
                        datasets: [{
                            label: 'Distanz (km)',
                            data: allMonthsDistances, //y-achse
                            backgroundColor: '#004aad',
                            borderColor: '#004aad',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    } 
                });

                //diagramm für letztes monat
                const thisMonthDates = data.thisMonth.map(e => e.date);
                const thisMonthDistances = data.thisMonth.map(e => Number(e.distance.toFixed(1)));

                const ctxThisMonth = document.getElementById('lastMonthChart').getContext('2d');

                new Chart(ctxThisMonth, {
                    type: 'bar', //art von diagramm
                    data: {     //daten, dei angezeigt werden müssen
                        labels: thisMonthDates, //x-achse
                        datasets: [{
                            label: 'Distanz (km)',
                            data: thisMonthDistances, //y-achse
                            backgroundColor: '#004aad',
                            borderColor: '#004aad',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    } 
                });
            })
            .catch(err => console.error("Fehler beim Laden der Charts:", err));
        }

        function uploadProfileData() {
            fetch('http://localhost:8000/api/profile')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Server-Fehler: " + response.status);
                }
               return response.json();
            })
            .then(dataList => {
                const container = document.getElementById('profile-container'); //in den klammern muss div-element sein
                container.innerHTML = ''; //platzhalter "lade.. " entfernen

                if (!dataList || dataList.length === 0) {
                    console.log(dataList)
                    container.innerHTML = '<p>keine profil daten</p>'
                    return;
                }

                const user = dataList[0];
                const hasPhoto = user.profilePhoto && user.profilePhoto.trim() !== ""; //prüft, ob in der db pfad da ist
                const avatarSrc = hasPhoto ? user.profilePhoto : "";
                const imageDisplay = hasPhoto ? "block" : "none";
                const textDisplay = hasPhoto ? "none" : "block";
                container.innerHTML = `
                    <div class="profile-card">
                        
                        <label for="avatarInput" class="avatar-circle">
                            <span id="uploadText" style="display: ${textDisplay};">+ Bild wählen</span>
                            <img id="avatarImage" src="${avatarSrc}" alt="ProfilBild" style="display: ${imageDisplay};">
                        </label>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">

                        <h2>${user.name} ${user.secondName}</h2>

                    </div>
                `;
                //befüllen die tabelle mit daten
                document.getElementById('stat-age').innerText = user.age;
                document.getElementById('stat-sex').innerText = user.sex;
                document.getElementById('stat-weight').innerText = user.weight + " kg";
                document.getElementById('stat-height').innerText = user.height + " cm";
                document.getElementById('stat-max-hr').innerText = user.maxHR + " bpm";
                document.getElementById('stat-resting-hr').innerText = user.restingHR + " bpm";
                document.getElementById('stat-max-distance').innerText = user.maxDistance + " km";
                document.getElementById('stat-max-speed').innerText = user.maxSpeed + " km/h";
                document.getElementById('stat-max-elevation-gain').innerText = user.maxElevationGain + " m";
                document.getElementById('stat-max-calorie-burn').innerText = user.maxCalorieBurn + " kcal";
                document.getElementById('stat-max-trainingload').innerText = user.maxTrainingLoad;

                const avatarInput = document.getElementById('avatarInput');
                document.getElementById('avatarInput').addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    if (!file) return;                           
        
                    const avatarImage = document.getElementById('avatarImage');
                    
                    //debug
                    console.log("image from user: ", avatarImage); 

                    const uploadText = document.getElementById('uploadText');
                    avatarImage.src = URL.createObjectURL(file);
                    avatarImage.style.display = 'block';
                    uploadText.style.display = 'none';

                    fetch('/api/upload-avatar', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/octet-stream'},
                        body: file //sendet bild als binärdaten
                    })
                    .then(response => {
                        if (response.ok) {
                            console.log("bild wurd an db gesendet");
                        } else {
                            console.log("fehler");
                        }
                    })
                    .catch(err => console.error("Fehler beim Laden:", err))
                            
                });  
            }) 
        }
        window.addEventListener('DOMContentLoaded', uploadProfileData);
        window.addEventListener('DOMContentLoaded', loadTrainingChart);
    </script>

</body>
</html>
