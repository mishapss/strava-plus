<!DOCTYPE html>
<html>
<head>
	<title>Strava-Plus challenges</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }
        h1 {
            margin-top: 60px;
            margin-left: 10px;
        }

        h2, p {
            margin: 10px;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f7fa;
            top: 0;
            width: 100%;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: rgb(0, 0, 0);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        ul li a:hover:not(.active) {
            background-color: #e34402;
        }

        ul li a.active {
            background-color: #f7f7fa;
        }

        .challenges-container {
        display: grid;
        /* auto-fill verhindert, dass 1 einzelne Karte die ganze Zeile ausfüllt */
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
        
        /* Optional: Zentriert das Grid auf großen Bildschirmen */
        max-width: 1200px;
        margin: 0 auto;
    }

    .challenge-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;
    }

    .challenge-image {
        width: 100%;
        height: 140px;
        object-fit: cover;
    }

    .challenge-content {
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .challenge-content h2 {
        font-size: 21px;
        margin: 0 0 15px 0;
    }

    .description {
        font-size: 16px;
        line-height: 1.4;
    }

    .challenge-info {
        font-size: 16px;
        margin-bottom: 5px;
    }

    .challenge-date {
        font-size: 16px;
        margin-top: 0;
    }

    .participants {
        font-size: 16px;
        margin-top: 5px;
    }

    .challenge-card button {
        margin-top: auto;

        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #ff5500;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .challenge-card button:hover {
        background: #e64d00;
    }
    </style>
</head>
<body>
    <ul>
        <li><a href="http://localhost:8000/upload-html">Training hochladen</a></li>
        <li><a href="http://localhost:8000/challenges">Herausforderungen</a></li>
        <li><a href="http://localhost:8000/rewards">Abzeichnungen</a></li>
        <li><a href="http://localhost:8000/about">Über Strava-Plus</a></li>     </ul>

	<div id="challenges-container" class="challenges-container">
        <p>Lade Herausforderungen</p>
    </div>    

    <script>
    function uploadChallenges() {
        fetch('http://localhost:8000/api/challenges') // schickt anfrage an den server auf route api/challenges
        .then(response => {                           // sobald der server antwortete, mach folgendes
            if (!response.ok) {                       // prüft, ob alles ok ist
                throw new Error("Server-Fehler: " + response.status); // fehler, wenn es schief geht
            } 
            return response.json();                   //nimmt string text vom server und wandelt ihn in javaskript-array
        })
        .then(data => {
            const container = document.getElementById('challenges-container'); //greift sich das div-element aus html-code
            container.innerHTML = ''; //platzhalter "lade..." entfernen

            //wenn vom server ein array mit viele challenges kommt, dann in array packen
            const challenges = Array.isArray(data) ? data : [data];

            if (challenges.length === 0) {
                container.innerHTML = '<p>keine herausforderungen vorhanden</p>'
                return;
            }

            challenges.forEach(challenge => {//baut dynamische challenge karte für webseite
                const challengeID = challenge.challengeID;
                const buttonID = `join-btn-${challengeID}`;
                const rewardImgID = `reward-image-${challengeID}` //dynamische bildID

                const idParticipating = challenge.status === 1 || challenge.status === 2;
                const buttonText = idParticipating ? "Bereits badei" : "An Herausforderung teilnehmen";
                const buttonDisabled = idParticipating ? "disabled" : "";

                const showRewardStyle = (challenge.status === 2 && challenge.imagePathReward) ? 'block' : 'none';
                const rewardSrc = challenge.imagePathReward || '';

                let statusDescription = "Nicht teilgenommen";

                if (challenge.status === 1) {
                    statusDescription = "Du nimmst teil";
                } else if (challenge.status === 2) {
                    statusDescription = "Erfogreich abgeschlossen, siehe die Abzeichnung auf der Auszeichnung-Seite";
                }

                console.log("cahllengeDaten: ", challenge);
                console.log("Status:", challenge.status, "Typ:", typeof challenge.status);
                console.log("BildpfadPictureReward:", challenge.imagePathReward || challenge.imagePathReward);
                console.log("BildpfadBild:", challenge.bild || challenge.bild);
                console.log("BildpfadImagepath:", challenge.imagePath || challenge.imagePath);

                const cardHTML = `
                            <div class="challenge-card">
                                <img class="challenge-image" src="${challenge.imagePath}" alt="${challenge.challengeName}">
                                <div class="challenge-content">
                                    <h2>${challenge.challengeName}</h2>
                                    <p class="description">${challenge.challengeDescription}</p>
                                    <p class="challenge-date">${challenge.challengeStartDate} bis ${challenge.challengeEndDate}</p>
                                    <p class="participants">Status: ${statusDescription}</p>
                                    <button id="${buttonID}" class="action-btn" ${buttonDisabled}>${buttonText}</button>
                                </div>                                    
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);//fügt das neu erzeugte karten-html am ende in die seite ein
                        const buttonElement = document.getElementById(buttonID);

                        buttonElement.addEventListener('click', () => {                          
                            fetch('http://localhost:8000/api/join-challenge', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ challengeID: challengeID})
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Server-Fehler: " + response.status)
                                }
                                return response.json();//wandelt der Antwort in json um                              
                            })
                            .then(result => {
                                if (result === true || result.success === true) {
                                    buttonElement.innerText = "Bereits dabei";
                                    buttonElement.disabled = true;
                                }
                            })
                            .catch(err => {
                                console.error("Fehler beim Beitreten: ", err);
                                alert("Fehler beim Beitreten zum Challenge");
                            })
                        });
                    });
                })
        .catch(err => {//fehlermeldung, falls etwas schief geht
            console.error("fehler: ", err);
            document.getElementById('challenges-container').innerHTML = '<p>Fehler beim Laden der Herausforderungen.</p>';
        });
    }

    window.addEventListener('DOMContentLoaded', uploadChallenges); //wartet bis die grundstruktur der html-seite geladen ist und dann ruft funktion auf

    /*
    function showTheReward() {
        fetch(`/api/challenges/${challengeID}`)
        .then(response => response.json)
        .then(data => {
            if (data.status === 2 && data.picture_reward) {
                const badgeImg = document.getElementById('reward-badge');

                badgeImg.src = data.picture_reward;
                badgeImg.style.display = 'block';
            }
        })
        .catch(error => console.error('Fehler beim Laden', error));
    }*/

    function pruefeObTeilnehmer(challengeID, buttonElemnt) {
        fetch('http://localhost:8000/api/check-participation?challengeID=' + challengeID)
        .then(response => {
            if (!response.ok) {
                throw new Error("Server-Fehler: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (data === true) {
                buttonElemnt.innerText = "Bereits dabei";
                buttonElemnt.disabled = true;
            } else {
                buttonElemnt.innerText = "An Herausforderung teilnehmen";
            }
        })
        .catch(err => {//fehlermeldung, falls etwas schief geht
            console.error("Fehler beim Prüfen der Teilnahme: ", err);
            buttonElemnt.innerText = "Fehler beim Laden";
        });
    }

</script>
</body>
</html>
