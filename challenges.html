<!DOCTYPE html>
<html>
<head>
	<title>Strava-Plus challenges</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }

        .challenges-container {
        display: grid;
        /* auto-fill verhindert, dass 1 einzelne Karte die ganze Zeile ausfüllt */
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 20px;
        
        /* Optional: Zentriert das Grid auf großen Bildschirmen */
        max-width: 1200px;
        margin: 0 auto;
    }

    .challenge-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;
    }

    .challenge-image {
        width: 100%;
        height: 140px;
        object-fit: cover;
    }

    .challenge-content {
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .challenge-content h2 {
        font-size: 21px;
        margin: 0 0 15px 0;
    }

    .description {
        font-size: 16px;
        line-height: 1.4;
    }

    .challenge-info {
        font-size: 16px;
        margin-bottom: 5px;
    }

    .challenge-date {
        font-size: 16px;
        margin-top: 0;
    }

    .participants {
        font-size: 16px;
        margin-top: 5px;
    }

    .challenge-card button {
        margin-top: auto;

        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #ff5500;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .challenge-card button:hover {
        background: #e64d00;
    }
    </style>
</head>
<body>
	<div id="challenges-container" class="challenges-container">
        <p>Lade Herausforderungen</p>
    </div>    

    <script>
    function uploadChallenges() {
        fetch('http://localhost:8000/api/challenges') // schickt anfrage an den server auf route api/challenges
        .then(response => {                           // sobald der server antwortete, mach folgendes
            if (!response.ok) {                       // prüft, ob alles ok ist
                throw new Error("Server-Fehler: " + response.status); // fehler, wenn es schief geht
            } 
            return response.json();                   //nimmt string text vom server und wandelt ihn in javaskript-array
        })
        .then(data => {
            const container = document.getElementById('challenges-container'); //greift sich das div-element aus html-code
            container.innerHTML = ''; //platzhalter "lade..." entfernen

            //wenn vom server ein array mit viele challenges kommt, dann in array packen
            const challenges = Array.isArray(data) ? data : [data];

            if (challenges.length === 0) {
                container.innerHTML = '<p>keine herausforderungen vorhanden</p>'
                return;
            }

            challenges.forEach(challenge => {//baut dynamische challenge karte für webseite
                const challengeID = challenge.challengeID;
                const buttonID = `join-btn-${challengeID}`;

                const idParticipating = challenge.status === 1;
                const buttonText = idParticipating ? "Bereits badei" : "An Herausforderung teilnehmen";
                const buttonDisabled = idParticipating ? "disabled" : "";

                const cardHTML = `
                            <div class="challenge-card">
                                <img class="challenge-image" src="${challenge.imagePath}" alt="${challenge.challengeName}">
                                <div class="challenge-content">
                                    <h2>${challenge.challengeName}</h2>
                                    <p class="description">${challenge.challengeDescription}</p>
                                    <p class="challenge-date">${challenge.challengeStartDate} bis ${challenge.challengeEndDate}</p>
                                    <p class="participants">👤 Status: ${challenge.status}</p>
                                    <button id="${buttonID}" class="action-btn" ${buttonDisabled}>${buttonText}</button>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);//fügt das neu erzeugte karten-html am ende in die seite ein
                        const buttonElement = document.getElementById(buttonID);

                        buttonElement.addEventListener('click', () => {                          
                            fetch('http://localhost:8000/api/join-challenge', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ challengeID: challengeID})
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Server-Fehler: " + response.status)
                                }
                                return response.json();//wandelt der Antwort in json um                              
                            })
                            .then(data => {
                                if (data === true || data.success === true) {
                                    buttonElement.innerText = "Bereits dabei";
                                    buttonElement.disabled = true;
                                }
                            })
                            .catch(err => {
                                console.error("Fehler beim Beitreten: ", err);
                                alert("Fehler beim Beitreten zum Challenge");
                            })
                        });
                    });
                })
        .catch(err => {//fehlermeldung, falls etwas schief geht
            console.error("fehler: ", err);
            document.getElementById('challenges-container').innerHTML = '<p>Fehler beim Laden der Herausforderungen.</p>';
        });
    }

    window.addEventListener('DOMContentLoaded', uploadChallenges()); //wartet bis die grundstruktur der html-seite geladen ist und dann ruft funktion auf

    function pruefeObTeilnehmer(challengeID, buttonElemnt) {
        fetch('http://localhost:8000/api/check-participation?challengeID=' + challengeID)
        .then(response => {
            if (!response.ok) {
                throw new Error("Server-Fehler: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            if (data === true) {
                buttonElemnt.innerText = "Bereits dabei";
                buttonElemnt.disabled = true;
            } else {
                buttonElemnt.innerText = "An Herausforderung teilnehmen";
            }
        })
        .catch(err => {//fehlermeldung, falls etwas schief geht
            console.error("Fehler beim Prüfen der Teilnahme: ", err);
            buttonElemnt.innerText = "Fehler beim Laden";
        });
    }

</script>
</body>
</html>
