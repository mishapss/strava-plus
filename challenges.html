<!DOCTYPE html>
<html>
<head>
	<title>Strava-Plus challenges</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
        }

        .challenges-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minimax(280px,1fr));
        gap: 20px;
        padding: 20px;
    }

    .challenge-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);

        display: flex;
        flex-direction: column;
    }

    .challenge-image {
        width: 100%;
        height: 140px;
        object-fit: cover;
    }

    .challenge-content {
        padding: 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .challenge-content h2 {
        font-size: 21px;
        margin: 0 0 15px 0;
    }

    .description {
        font-size: 16px;
        line-height: 1.4;
    }

    .challenge-info {
        font-size: 16px;
        margin-bottom: 5px;
    }

    .challenge-date {
        font-size: 16px;
        margin-top: 0;
    }

    .participants {
        font-size: 16px;
        margin-top: 5px;
    }

    .challenge-card button {
        margin-top: auto;

        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 7px;

        background: #ff5500;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    .challenge-card button:hover {
        background: #e64d00;
    }
    </style>
</head>
<body>
	<div id="challenges-container" class="challenges-container">
        <p>Lade Herausforderungen</p>
    </div>    

    <script>
    function uploadChallenges() {
        fetch('http://localhost:8000/api/challenges')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('challenges-container');
            container.innerHTML = ''; //platzhalter "lade..." entfernen

            //wenn vom server ein array mit viele challenges kommt
            const challenges = Array.isArray(data) ? data : [data];

            challenges.forEach(challenge => {
                const cardHTML = `
                            <div class="challenge-card">
                                <div class="challenge-content">
                                    <h2>${challenge.challengeName}</h2>
                                    <p class="description">${challenge.challengeDescription}</p>
                                    <p class="challenge-info">Ziel: ${challenge.ziel}</p>
                                    <p class="challenge-date">${challenge.challengeStartDate} bis ${challenge.challengeEndDate}</p>
                                    <p class="participants">👤 Status: ${challenge.status}</p>
                                    <button class="action-btn">An Herausforderung teilnehmen</button>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', cardHTML);
                    });
                })
        .catch(err => {
            console.error("fehler: ", err);
            document.getElementById('challenges-container').innerHTML = '<p>Fehler beim Laden der Herausforderungen.</p>';
        });
    }

    window.addEventListener('DOMContentLoaded', getDatenAusDBToUpload());
</script>
</body>
</html>
