repos:
  - repo: local
    hooks: 
      - id: check-java-utf8
        name: Check Java files for valid UTF-8
        entry: python -c "import sys; [open(f, encoding='utf-8').read() for f in sys.argv[1:]]"
        language: python
        files: \.(java|html|xml|json|md|properties|yml|yaml|txt)$

      - id: check-trailing-whitespace
        name: Check for trailing whitespace
        entry: python -c "import sys; err = False; [(print(f'[LEERZEICHEN FEHLER] {f}:{i+1}'), exec('err=True')) for f in sys.argv[1:] for i, line in enumerate(open(f, encoding='utf-8', errors='ignore')) if line.rstrip('\r\n') != line.rstrip()]; sys.exit(1 if err else 0)"        
        language: python
        files: \.java$
